name: IMD DAWSA AI Web, Android and backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  engineering-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce English engineering content
        run: python scripts/check_engineering_language.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate PWA manifest
        run: python -c "import json,pathlib; json.loads(pathlib.Path('web/manifest.webmanifest').read_text(encoding='utf-8'))"
      - name: Validate service worker JavaScript
        run: node --check web/sw.js
      - name: Validate inline Web application JavaScript
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          html = pathlib.Path('web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          if not scripts:
              raise SystemExit('No inline application script found')
          for index, script in enumerate(scripts):
              path = pathlib.Path(f'/tmp/imd-web-inline-{index}.js')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
          required = ['manifest.webmanifest', 'sw.js', 'icon.svg']
          missing = [name for name in required if not (pathlib.Path('web') / name).is_file()]
          if missing:
              raise SystemExit('Missing Web assets: ' + ', '.join(missing))
          print(f'Validated {len(scripts)} inline script(s) and {len(required)} required assets')
          PY

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: imd-dawsa-ai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
