name: IMD DAWSA AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest -q

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

  web-client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate PWA manifest and service worker syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest', 'utf8'))"
          node --check web/sw.js
          node --input-type=commonjs -e "const fs=require('fs'); const html=fs.readFileSync('web/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/gi)]; if(!scripts.length) throw new Error('No inline application script found'); for(const script of scripts) new Function(script[1]); const ids=[...html.matchAll(/\\sid=[\\\"']([^\\\"']+)/g)].map(m=>m[1]); const unique=new Set(ids); for(const match of html.matchAll(/\\$\\(['\\\"]#([^'\\\"]+)/g)) if(!unique.has(match[1])) throw new Error('Missing HTML element for selector #'+match[1]);"
      - name: Verify required web assets
        run: |
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js
          test -s web/icon.svg
