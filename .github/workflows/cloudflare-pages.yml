name: Deploy IMD DAWSA AI to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify static site entry point
        run: |
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/sw.js

      - name: Deploy static website to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "59517119af42bc3fa5f297fea64d9479"
          command: pages deploy web --project-name=imd-dawsa-ai --branch=main
