<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMD DAWSA AI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(850px,100%);background:#131b30;border:1px solid #293653;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0006}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,5vw,38px)}.sub{color:#aab7d1;margin:8px 0 20px}
#status{font-size:13px;color:#9fe3bd}#chat{height:52vh;min-height:260px;overflow:auto;background:#0c1427;border-radius:16px;padding:14px}
.msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.6;max-width:90%}
.user{background:#263c67;margin-right:auto}.ai{background:#1b2b28;margin-left:auto}
form{display:flex;gap:10px;margin-top:14px}textarea{flex:1;resize:vertical;min-height:54px;max-height:180px;border-radius:12px;padding:14px;background:#0c1427;color:white;border:1px solid #344563;font:inherit}
button{border:0;border-radius:12px;background:#9cc4ff;color:#101a2d;padding:0 22px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
footer{color:#8795b1;font-size:12px;margin-top:12px}
</style></head>
<body><main>
<header><h1>IMD DAWSA AI</h1><span id="status">جارٍ فحص النموذج المحلي…</span></header>
<p class="sub">مساعدك الذكي الخاص — يعمل عبر نموذج Ollama المحلي على جهازك.</p>
<section id="chat" aria-live="polite"><div class="msg ai">مرحباً! أنا IMD DAWSA AI. شغّل Ollama وحمّل النموذج أولاً، ثم اكتب رسالتك هنا.</div></section>
<form id="form"><textarea id="message" placeholder="اكتب رسالتك…" required></textarea><button id="send">إرسال</button></form>
<footer>تُحفظ المحادثات محلياً في قاعدة SQLite. لا تضع أسراراً أو كلمات مرور في المحادثة.</footer>
</main>
<script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),send=document.querySelector('#send'),statusEl=document.querySelector('#status');
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
fetch('/api/readiness').then(r=>r.json()).then(d=>statusEl.textContent=d.ready?'النموذج المحلي متصل: '+d.model:'Ollama غير متصل — شغّله أولاً').catch(()=>statusEl.textContent='تعذر فحص النموذج');
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';send.disabled=true;send.textContent='…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'حدث خطأ');add(d.reply,'ai');}catch(err){add('تعذر الحصول على رد: '+err.message,'ai');}finally{send.disabled=false;send.textContent='إرسال';input.focus();}});
</script></body></html>
